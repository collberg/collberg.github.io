const FALL_GAP = [0.8, 2.6];          /* pause between successive leaves      */
const LEAF_W = [56, 80];               /* width of an ordinary leaf            */
const WIND_PX = 62;                   /* sideways leaf speed at wind = 1      */
const LOGO_T0 = 5;                    /* on-screen seconds until the logo is blown in */
const LOGO_SIZE = 113;                /* larger than an ordinary leaf, so the tiger reads */
const LOGO_ENTRY_Y = [330, 390];      /* height at which it enters, on the left */
const LOGO_GUST = 220;                /* speed of the gust that carries it in */
const LOGO_GUST_TIME = 2.5;           /* how long the gust lasts              */
const LOGO_TUMBLES = [1.2, 1.8];      /* turns it makes before steadying      */
const LOGO_STEADY = 3;                /* time constant of the tumbling dying  */
const LOGO_CRUISE = 85;               /* speed while the breeze carries it    */
const LOGO_PAST_HEAP = 1250;          /* it stays aloft until it is past here */
const LOGO_LAND_X = [1540, 1860];     /* where it comes to rest: anywhere on  */
const LOGO_LAND_Y = [698, 734];       /* the field to the right of the heap   */
const LOGO_SINK = 42;                 /* descent speed on the way down        */
const LOGO_REST = 5;                  /* how long it lies on the field        */
const LOGO_LIFT_TIME = 3.6;           /* the second gust: up and over the heap */
const LOGO_APEX_Y = [230, 290];       /* how high that gust takes it          */
const LOGO_FLIP_AT = 0.9;             /* into the lift, it starts to turn over */
const LOGO_FLIP_TIME = 2.6;           /* and takes this long to do so, once   */
const LOGO_HEAP_X = [-90, 90];        /* where on the heap it lands, off-centre */
const LOGO_HEAP_SINK = 30;            /* descent speed onto the heap          */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") !== null;

let W;
let H;
let DPR;
let scale;
let rnd = Math.random;
let IMG = {};
let pileTop = null;
let hangs = [];
let fallers = [];
let landed = [];
let clouds = [];
let logo = null;
let wind = 0;
let simTime = 0;
let last = 0;
let raf = null;

function mulberry32(a) {
   return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
   };
}

function rr(a, b) {
   return a + rnd() * (b - a);
}

function pick(a) {
   return a[(rnd() * a.length) | 0];
}

/*****************************************************************************/
/* Loading. Each leaf sprite's stem tip is located once, so a hanging leaf   */
/* pivots exactly where its stem meets the branch; the heap's silhouette is  */
/* sampled so that leaves can land on it.                                    */
/*****************************************************************************/
function loadImg(src) {
   return new Promise(function (resolve) {
      const i = new Image();
      i.onload = function () {
         resolve(i);
      };
      i.onerror = function () {
         resolve(i);
      };
      i.src = src;
   });
}

function alphaOf(img, w, h) {
   const c = document.createElement("canvas");
   c.width = w;
   c.height = h;
   const g = c.getContext("2d");
   g.drawImage(img, 0, 0, w, h);
   return g.getImageData(0, 0, w, h).data;
}

/* The stem tip: the topmost opaque pixel that has more stem right below it  */
/* (a stray speck above the leaf does not).                                  */
function findStem(img) {
   const w = img.naturalWidth;
   const h = img.naturalHeight;
   const d = alphaOf(img, w, h);
   function rowCentre(y, lo, hi) {
      let sum = 0;
      let n = 0;
      for (let x = Math.max(0, lo); x < Math.min(w, hi); x++) {
         if (d[(y * w + x) * 4 + 3] > 128) {
            sum += x;
            n++;
         }
      }
      return n > 0 ? sum / n : null;
   }
   for (let y = 0; y < h - 6; y++) {
      const x = rowCentre(y, 0, w);
      if (x === null) {
         continue;
      }
      let solid = true;
      for (let k = 1; k <= 5; k++) {
         if (rowCentre(y + k, x - 6, x + 7) === null) {
            solid = false;
         }
      }
      if (solid) {
         return {x: x, y: y};
      }
   }
   return {x: w / 2, y: 0};
}

/* The tree is painted into the background, but the clouds must pass behind  */
/* it: cut the wood (brown, or outline-black) out of the sky into a layer    */
/* of its own, to be drawn over the clouds.                                  */
function cutTree(bg) {
   const c = document.createElement("canvas");
   c.width = TREE.w;
   c.height = TREE.h;
   const g = c.getContext("2d");
   g.drawImage(bg, 0, 0);
   const id = g.getImageData(0, 0, TREE.w, TREE.h);
   const d = id.data;
   for (let i = 0; i < d.length; i += 4) {
      const brown = (d[i] - d[i + 2] - 30) / 25;
      const dark = (300 - (d[i] + d[i + 1] + d[i + 2])) / 80;
      d[i + 3] = 255 * Math.max(0, Math.min(1, Math.max(brown, dark)));
   }
   g.putImageData(id, 0, 0);
   return c;
}

/* pileTop[i] = y (scene coordinates) of the heap's surface in column i.     */
function samplePile(img) {
   const w = 270;
   const h = Math.round(w * img.naturalHeight / img.naturalWidth);
   const d = alphaOf(img, w, h);
   const k = PILE.w / w;
   const top = [];
   for (let x = 0; x < w; x++) {
      top.push(null);
      for (let y = 0; y < h; y++) {
         if (d[(y * w + x) * 4 + 3] > 60) {
            top[x] = PILE.base - (h - y) * k;
            break;
         }
      }
   }
   return top;
}

function pileTopAt(x) {
   const i = Math.round((x - (PILE.cx - PILE.w / 2)) / PILE.w * pileTop.length);
   if (i < 0 || i >= pileTop.length) {
      return null;
   }
   return pileTop[i];
}

async function loadAll() {
   IMG.bg = await loadImg(ASSETS.bg);
   IMG.pile = await loadImg(ASSETS.pile);
   IMG.logo = await loadImg(ASSETS.logo);
   IMG.logoBack = await loadImg(ASSETS.logoBack);
   IMG.clouds = await Promise.all(ASSETS.clouds.map(loadImg));
   const leaves = await Promise.all(ASSETS.leaves.map(loadImg));
   IMG.leaves = leaves.map(function (img) {
      return {img: img, stem: findStem(img)};
   });
   pileTop = samplePile(IMG.pile);
   IMG.tree = cutTree(IMG.bg);
}

function resize() {
   DPR = Math.min(2, window.devicePixelRatio || 1);
   W = canvas.clientWidth || canvas.parentNode.clientWidth || 980;
   scale = W / IMG_W;
   H = Math.round(IMG_H * scale);
   canvas.style.height = H + "px";
   canvas.width = Math.round(W * DPR);
   canvas.height = Math.round(H * DPR);
}

/*****************************************************************************/
/* Hanging leaves. Each hangs by its stem from an anchor on a branch and     */
/* sways there, leaning with the wind. Those with a fall time let go once;   */
/* the others stay on the tree for good. Nothing is ever re-grown.           */
/*****************************************************************************/
function newHang(a) {
   return {
      x: a[0],
      y: a[1],
      leaf: pick(IMG.leaves),
      w: rr(LEAF_W[0], LEAF_W[1]),
      phase: rr(0, 6.28),
      amp: rr(0.08, 0.2),
      freq: rr(0.6, 1.2),
      fallAt: Infinity,
      gone: false
   };
}

function scheduleFalls() {
   const order = hangs.slice();
   for (let i = order.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      const t = order[i];
      order[i] = order[j];
      order[j] = t;
   }
   const stay = Math.round(order.length * STAY_FRACTION);
   let t = FIRST_FALL;
   for (let i = stay; i < order.length; i++) {
      order[i].fallAt = t;
      t += rr(FALL_GAP[0], FALL_GAP[1]);
   }
   /* Draw the leaves in the order they fall, the first to go at the back   */
   /* and the ones that stay in front. A leaf that lets go was then covering */
   /* nothing that is still on the tree, so its going never uncovers a leaf  */
   /* that was hidden behind it -- which would look like one growing.        */
   hangs.sort(function (a, b) {
      return a.fallAt < b.fallAt ? -1 : (a.fallAt > b.fallAt ? 1 : 0);
   });
}

function hangAngle(h) {
   /* a leaf about to let go trembles a little harder */
   const shiver = 1 + 1.5 * Math.max(0, 1 - (h.fallAt - simTime) / 1.2);
   return h.amp * shiver * Math.sin(simTime * h.freq + h.phase) - wind * 0.3;
}

function detach(h) {
   const img = h.leaf.img;
   const k = h.w / img.naturalWidth;
   const ang = hangAngle(h);
   /* the blade's centre, relative to the stem tip, turned by the hang angle */
   const lx = (img.naturalWidth / 2 - h.leaf.stem.x) * k;
   const ly = (img.naturalHeight / 2 - h.leaf.stem.y) * k;
   fallers.push({
      leaf: h.leaf,
      w: h.w,
      x: h.x + lx * Math.cos(ang) - ly * Math.sin(ang),
      y: h.y + lx * Math.sin(ang) + ly * Math.cos(ang),
      vx: 0,
      vy: 0,
      rot: ang,
      turn: ang,
      spin: rr(-0.8, 0.8),
      rock: rr(0.25, 0.6),
      age: 0,
      fall: rr(40, 58),
      sway: rr(0, 6.28),
      swaySpd: rr(1.2, 2.0),
      swayA: rr(14, 30),
      sink: rr(12, 70),
      landY: rr(LAND_BAND[0], LAND_BAND[1]),
      behind: true
   });
   h.gone = true;
}

/* Is a falling leaf still overlapping one that hangs on the tree? Until it  */
/* has slid clear of them it is drawn behind them, where it hung.            */
function overTree(p) {
   for (const h of hangs) {
      if (!h.gone) {
         const dx = p.x - h.x;
         const dy = p.y - (h.y + 0.62 * h.w);
         const reach = 0.62 * (p.w + h.w);
         if (dx * dx + dy * dy < reach * reach) {
            return true;
         }
      }
   }
   return false;
}

function stepHang(h) {
   if (!h.gone && simTime >= h.fallAt) {
      detach(h);
   }
}

function drawHang(h) {
   if (h.gone) {
      return;
   }
   const img = h.leaf.img;
   const k = h.w / img.naturalWidth;
   ctx.save();
   ctx.translate(h.x, h.y);
   ctx.rotate(hangAngle(h));
   /* stem tip on the anchor (2px into the wood); the blade hangs below */
   ctx.drawImage(img, -h.leaf.stem.x * k, -h.leaf.stem.y * k - 2, h.w, h.w * img.naturalHeight / img.naturalWidth);
   ctx.restore();
}

/*****************************************************************************/
/* Falling leaves: a slow zig-zag, carried to the right by the wind. A leaf  */
/* lands on the heap if it sinks into the heap's silhouette, otherwise on    */
/* the field. Landed leaves are kept forever.                                */
/*****************************************************************************/
function land(p, depth) {
   landed.push({leaf: p.leaf, x: p.x, y: p.y, w: p.w, rot: p.rot, depth: depth});
   p.dead = true;
}

function stepFaller(p, dt) {
   p.age += dt;
   if (p.behind && !overTree(p)) {
      p.behind = false;
   }
   p.sway += p.swaySpd * dt;
   const ease = Math.min(1, p.age / 1.5);
   const vxT = (wind * WIND_PX + p.swayA * p.swaySpd * Math.cos(p.sway)) * ease;
   const vyT = p.fall * (1 + 0.35 * Math.cos(2 * p.sway));
   p.vx += (vxT - p.vx) * Math.min(1, 2.5 * dt);
   p.vy += (vyT - p.vy) * Math.min(1, 1.8 * dt);
   p.x += p.vx * dt;
   p.y += p.vy * dt;
   p.turn += p.spin * dt;
   p.rot += (p.turn + p.rock * Math.cos(p.sway) - p.rot) * Math.min(1, 3 * dt);
   const top = pileTopAt(p.x);
   if (top !== null && p.y > top + p.sink) {
      land(p, PILE.base + 1);
      return;
   }
   if (p.y >= p.landY) {
      land(p, p.y);
   }
}

/*****************************************************************************/
/* The logo: one big purple leaf, the tiger's head on one side and the       */
/* version number on the other.                                              */
/*                                                                           */
/* First flight: a gust blows it in from the left, tumbling and lifting; the */
/* breeze then carries it, steadying, across the scene and over the heap,    */
/* and beyond the heap it flutters down like the other leaves and lies on    */
/* the field, tiger side up.                                                 */
/*                                                                           */
/* Second flight: after a rest a gust picks it up again and whirls it back   */
/* up over the heap; on the way it slowly turns over, once, so the version   */
/* number shows,                                                             */
/* and then it drifts down onto the heap and stays there.                    */
/*****************************************************************************/
function newLogo() {
   const tilt = rr(-0.25, 0.25);
   const turn = tilt - rr(LOGO_TUMBLES[0], LOGO_TUMBLES[1]) * 6.2832;
   return {
      state: "wait",
      flight: 1,
      x: -LOGO_SIZE * 0.7,
      y: rr(LOGO_ENTRY_Y[0], LOGO_ENTRY_Y[1]),
      vx: LOGO_GUST,
      vy: -25,
      tilt: tilt,
      turn: turn,
      steady: LOGO_STEADY,
      rot: turn,
      flip: 0,
      age: 0,
      rest: LOGO_REST,
      sway: rr(0, 6.28),
      sink: LOGO_SINK,
      apexX: 0,
      apexY: 0,
      landX: rr(LOGO_LAND_X[0], LOGO_LAND_X[1]),
      landY: rr(LOGO_LAND_Y[0], LOGO_LAND_Y[1])
   };
}

/* Start the second flight: aim for a point above the heap, and from there   */
/* for a spot on the heap's surface.                                         */
function liftLogo(p) {
   p.state = "lift";
   p.flight = 2;
   p.age = 0;
   p.landX = PILE.cx + rr(LOGO_HEAP_X[0], LOGO_HEAP_X[1]);
   p.landY = pileTopAt(p.landX) + LOGO_SIZE * 0.3;
   p.apexX = p.landX + rr(-40, 40);
   p.apexY = rr(LOGO_APEX_Y[0], LOGO_APEX_Y[1]);
   p.sink = LOGO_HEAP_SINK;
   /* no tumbling this time: turning over, once, is the only thing it does */
   p.tilt = rr(-0.2, 0.2);
   p.turn = p.tilt;
}

function stepLogo(p, dt) {
   let rock = 0;
   if (p.state === "wait") {
      if (simTime >= LOGO_T0 * SPEED) {
         p.state = "gust";
      }
      return;
   }
   if (p.state === "home") {
      return;
   }
   if (p.state === "rest") {
      p.rest -= dt;
      if (p.rest <= 0) {
         liftLogo(p);
      }
   }
   p.age += dt;
   if (p.state === "gust") {
      p.vy += (-40 - p.vy) * Math.min(1, 1.5 * dt);
      if (p.age > LOGO_GUST_TIME) {
         p.state = "cruise";
      }
   } else if (p.state === "cruise") {
      p.sway += 1.5 * dt;
      const vxT = LOGO_CRUISE + 40 * Math.cos(p.sway);
      const vyT = 8 + 14 * Math.sin(2 * p.sway);
      p.vx += (vxT - p.vx) * Math.min(1, 2 * dt);
      p.vy += (vyT - p.vy) * Math.min(1, 1.6 * dt);
      rock = 0.3 * Math.cos(p.sway);
      if (p.x > LOGO_PAST_HEAP) {
         p.state = "flutter";
      }
   } else if (p.state === "lift") {
      const left = Math.max(0.5, LOGO_LIFT_TIME - p.age);
      p.vx += ((p.apexX - p.x) / left - p.vx) * Math.min(1, 3 * dt);
      p.vy += ((p.apexY - p.y) / left - p.vy) * Math.min(1, 3 * dt);
      if (p.age > LOGO_LIFT_TIME) {
         p.state = "flutter";
      }
   } else if (p.state === "flutter") {
      const d = p.landY - p.y;
      const near = Math.min(1, d / 160);
      const timeLeft = d / p.sink + 1.2;
      p.sway += 1.5 * dt;
      const vxT = (p.landX - p.x) / timeLeft + 50 * Math.cos(p.sway) * near;
      const vyT = Math.max(7, Math.min(p.sink, d * 0.8));
      p.vx += (vxT - p.vx) * Math.min(1, 2 * dt);
      p.vy += (vyT - p.vy) * Math.min(1, 1.6 * dt);
      rock = 0.3 * Math.cos(p.sway) * near;
      if (d <= 0) {
         p.y = p.landY;
         p.state = p.flight === 1 ? "rest" : "home";
      }
   }
   if (p.state === "rest" || p.state === "home") {
      p.vx = 0;
      p.vy = 0;
   }
   if (p.flight === 2 && p.age > LOGO_FLIP_AT) {
      p.flip = Math.min(1, p.flip + dt / LOGO_FLIP_TIME);
   }
   p.x += p.vx * dt;
   p.y += p.vy * dt;
   p.turn += (p.tilt - p.turn) * Math.min(1, dt / p.steady);
   p.rot += (p.turn + rock - p.rot) * Math.min(1, 3 * dt);
}

/* Turning over is a squeeze about the leaf's own stem axis: the face thins  */
/* to an edge, and widens again as the other side.                           */
function drawLogo(p) {
   const c = Math.cos(Math.PI * p.flip);
   const img = c >= 0 ? IMG.logo : IMG.logoBack;
   const h = LOGO_SIZE * img.naturalHeight / img.naturalWidth;
   ctx.save();
   ctx.translate(p.x, p.y);
   ctx.rotate(p.rot);
   ctx.scale(Math.max(0.03, Math.abs(c)), 1);
   ctx.drawImage(img, -LOGO_SIZE / 2, -h / 2, LOGO_SIZE, h);
   ctx.restore();
}

/*****************************************************************************/
/* Drawing and the main loop.                                                */
/*****************************************************************************/
function sprite(img, x, y, w, rot, alpha) {
   const h = w * (img.naturalHeight / img.naturalWidth || 1);
   ctx.save();
   ctx.globalAlpha = alpha;
   ctx.translate(x, y);
   if (rot) {
      ctx.rotate(rot);
   }
   ctx.drawImage(img, -w / 2, -h / 2, w, h);
   ctx.restore();
}

function render() {
   ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
   ctx.imageSmoothingQuality = "high";
   ctx.drawImage(IMG.bg, 0, 0, IMG_W, IMG_H);
   for (const c of clouds) {
      sprite(c.img, c.x, c.y, c.w, 0, 0.95);
   }
   ctx.drawImage(IMG.tree, 0, 0);
   const pileH = PILE.w * IMG.pile.naturalHeight / IMG.pile.naturalWidth;
   ctx.drawImage(IMG.pile, PILE.cx - PILE.w / 2, PILE.base - pileH, PILE.w, pileH);
   for (const p of fallers) {
      if (p.behind) {
         sprite(p.leaf.img, p.x, p.y, p.w, p.rot, 1);
      }
   }
   for (const h of hangs) {
      drawHang(h);
   }
   /* everything on (or headed for) the field, drawn back to front */
   const items = [];
   for (const L of landed) {
      items.push({depth: L.depth, leaf: L});
   }
   for (const p of fallers) {
      if (!p.behind) {
         items.push({depth: p.landY, leaf: p});
      }
   }
   if (logo.state !== "wait") {
      items.push({depth: PILE.base + 2, leaf: null});
   }
   items.sort(function (a, b) {
      return a.depth - b.depth;
   });
   for (const it of items) {
      if (it.leaf === null) {
         drawLogo(logo);
      } else {
         sprite(it.leaf.leaf.img, it.leaf.x, it.leaf.y, it.leaf.w, it.leaf.rot, 1);
      }
   }
   if (DEBUG) {
      ctx.fillStyle = "#f0f";
      for (const a of ANCHORS) {
         ctx.fillRect(a[0] - 3, a[1] - 3, 6, 6);
      }
   }
}

/* A steady breeze to the right, with slow gusts; always positive. */
function windAt(t) {
   return 0.55 + 0.22 * Math.sin(t * 0.21) + 0.13 * Math.sin(t * 0.57 + 1.2) + 0.06 * Math.sin(t * 1.6 + 0.5);
}

function update(dt) {
   simTime += dt;
   wind = windAt(simTime);
   for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x - c.w / 2 > IMG_W) {
         c.x = -c.w / 2;
      }
   }
   for (const h of hangs) {
      stepHang(h);
   }
   for (const p of fallers) {
      stepFaller(p, dt);
   }
   fallers = fallers.filter(function (p) {
      return !p.dead;
   });
   stepLogo(logo, dt);
}

function loop(now) {
   let dt = (now - last) / 1000;
   last = now;
   dt = Math.max(0, Math.min(0.05, dt));
   update(dt * SPEED);
   render();
   raf = requestAnimationFrame(loop);
}

function seekTo(sec) {
   const h = 1 / 60;
   for (let s = 0; s < sec * SPEED; s += h) {
      update(h);
   }
   render();
}

function reset() {
   cancelAnimationFrame(raf);
   const seed = params.get("seed");
   rnd = mulberry32(seed !== null ? parseInt(seed, 10) : (Math.random() * 1e9) >>> 0);
   resize();
   simTime = 0;
   wind = windAt(0);
   hangs = ANCHORS.map(newHang);
   scheduleFalls();
   fallers = [];
   landed = [];
   /* a few leaves already lying on the field, clear of the heap */
   for (let i = 0; i < 12; i++) {
      const left = rnd() < 0.6;
      const x = left ? rr(180, PILE.cx - PILE.w / 2 - 20) : rr(PILE.cx + PILE.w / 2 + 20, IMG_W - 60);
      const y = rr(LAND_BAND[0], LAND_BAND[1]);
      landed.push({leaf: pick(IMG.leaves), x: x, y: y, w: rr(LEAF_W[0], LEAF_W[1]), rot: rr(0, 6.28), depth: y});
   }
   clouds = CLOUDS.map(function (k) {
      return {img: IMG.clouds[k.i], x: k.x, y: k.y, w: k.w, v: k.v};
   });
   logo = newLogo();
   const seek = params.get("seek");
   const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
   if (seek !== null) {
      seekTo(parseFloat(seek));
   } else if (still) {
      seekTo(120);
   } else {
      last = performance.now();
      raf = requestAnimationFrame(loop);
   }
}

addEventListener("resize", function () {
   resize();
   render();
});
loadAll().then(reset);
</script>
</body>
</html>
